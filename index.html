<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp qrupuna qoşul</title>
<meta name="format-detection" content="telephone=no">
<style>
  :root { --green:#25D366; --text:#111; }
  html,body{margin:0;padding:0;background:#f6f7f8;color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{min-height:100svh;display:grid;place-items:center;padding:24px}
  .card{max-width:640px;width:100%;background:#fff;border-radius:16px;
    box-shadow:0 6px 24px rgba(0,0,0,.06);padding:28px 24px;text-align:center}
  h1{margin:.2rem 0 1rem;font-size:clamp(22px,4.5vw,30px)}
  p{margin:.6rem 0 .9rem;line-height:1.6}
  .row{display:flex;gap:12px;flex-direction:column;align-items:center}
  .btn{display:inline-block;border:0;border-radius:12px;padding:14px 22px;
    font-weight:700;text-decoration:none;font-size:18px;width:100%;max-width:420px;cursor:pointer}
  .btn-primary{background:var(--green);color:#fff}
  .btn-outline{background:#eef3ee;color:#0b0b0b}
  .hint{font-size:13px;color:#666;margin-top:8px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>WhatsApp qrupuna qoşul</h1>
    <p>Aşağıdakı düymələrdən birini seç.</p>

    <div id="iosPanel" class="hidden">
      <div class="row">
        <a id="btnIOS_WAB" class="btn btn-primary"  href="#">WhatsApp <b>Business</b> ilə aç</a>
        <a id="btnIOS_WA"  class="btn btn-outline" href="#">Adi WhatsApp ilə aç</a>
      </div>
      <p class="hint">TikTok/Instagram içində açılsa da işləyəcək.</p>
    </div>

    <div id="androidPanel" class="hidden">
      <a id="btnAND" class="btn btn-primary" href="#">Qrupa qoşul (Android)</a>
      <p class="hint">Chooser çıxacaq — Adi/Business seç.</p>
    </div>

    <div id="otherPanel" class="hidden">
      <a id="btnOTHER" class="btn btn-primary" href="#">Qrupa qoşul</a>
    </div>
  </div>
</div>

<script>
  /* ==== TOPLULUQ + QRUP ==== */
  const TOPLULUK = "https://chat.whatsapp.com/GbbXxshpZM27imtEcy0Eos";
  const CODE     = "I2FH6EL06EdHt05Anj92Ne";       // qrup kodu
  const CHAT     = `https://chat.whatsapp.com/${CODE}`;
  const DL_WA    = `whatsapp://accept?code=${CODE}`;
  const DL_WAB   = `whatsapp-business://accept?code=${CODE}`;

  const UA       = navigator.userAgent;
  const isAndroid = /Android/i.test(UA);
  const isIOS     = /iPhone|iPad|iPod/i.test(UA);

  function openNew(u){
    try { window.open(u, "_blank"); }
    catch(_) { location.href = u; }
  }

  /* ==== İOS ==== */
  function setupIOS(){
    document.getElementById("iosPanel").classList.remove("hidden");

    function go(deep){
      openNew(TOPLULUK);          // topluluğun meta görünüşü açılsın
      setTimeout(()=> location.href = deep, 700);
      setTimeout(()=> location.href = CHAT, 1500);
    }

    document.getElementById("btnIOS_WAB").onclick = e => { e.preventDefault(); go(DL_WAB); };
    document.getElementById("btnIOS_WA").onclick  = e => { e.preventDefault(); go(DL_WA); };
  }

  /* ==== ANDROID ==== */
  function setupAndroid(){
    document.getElementById("androidPanel").classList.remove("hidden");
    document.getElementById("btnAND").onclick = e => {
      e.preventDefault();
      openNew(TOPLULUK);
      setTimeout(()=> location.href = `intent://chat.whatsapp.com/${CODE}#Intent;scheme=https;end`, 600);
    };
  }

  /* ==== OTHER ==== */
  function setupOther(){
    document.getElementById("otherPanel").classList.remove("hidden");
    document.getElementById("btnOTHER").onclick = e => {
      e.preventDefault();
      location.href = CHAT;
    };
  }

  (function init(){
    if (isIOS) setupIOS();
    else if (isAndroid) setupAndroid();
    else setupOther();
  })();
</script>
</body>
</html>
