<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp qrupuna qoşul</title>
  <meta name="format-detection" content="telephone=no">
  <style>
    :root { --green:#25D366; --text:#111; }
    html,body{
      margin:0;
      padding:0;
      background:#f6f7f8;
      color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    }
    .wrap{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      max-width:640px;
      width:100%;
      background:#fff;
      border-radius:16px;
      box-shadow:0 6px 24px rgba(0,0,0,.06);
      padding:28px 24px;
      text-align:center;
    }
    h1{
      margin:.2rem 0 1rem;
      font-size:clamp(22px,4.5vw,30px);
    }
    p{
      margin:.6rem 0 .9rem;
      line-height:1.6;
    }
    .btn{
      display:inline-block;
      border:0;
      border-radius:12px;
      padding:14px 22px;
      font-weight:700;
      text-decoration:none;
      font-size:18px;
      width:100%;
      max-width:420px;
      cursor:pointer;
      background:var(--green);
      color:#fff;
      margin-top:12px;
    }
    .hint{
      font-size:13px;
      color:#666;
      margin-top:10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>WhatsApp qrupuna qoşul</h1>
      <p>Aşağıdakı düyməni bas və birbaşa qrupa keç.</p>

      <!-- BURADA YALNIZ QRUP LINKİ VAR -->
      <a class="btn"
         href="https://chat.whatsapp.com/GbbXxshpZM27imtEcy0Eos">
        Qrupa qoşul
      </a>

      <p class="hint">
        Telefonunda WhatsApp və ya WhatsApp Business quraşdırılıbsa,
        avtomatik həmin tətbiqdə açılacaq.
      </p>
    </div>
  </div>
</body>
</html>
