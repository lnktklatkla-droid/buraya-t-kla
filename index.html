<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp qrupuna qoşul</title>
<meta name="format-detection" content="telephone=no">
<style>
  :root { --green:#25D366; --text:#111; }
  html,body{
    margin:0;padding:0;background:#f6f7f8;color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif
  }
  .wrap{min-height:100svh;display:grid;place-items:center;padding:24px}
  .card{
    max-width:640px;width:100%;background:#fff;border-radius:16px;
    box-shadow:0 6px 24px rgba(0,0,0,.06);
    padding:28px 24px;text-align:center
  }
  h1{margin:.2rem 0 1rem;font-size:clamp(22px,4.5vw,30px)}
  p{margin:.6rem 0 .9rem;line-height:1.6}
  .row{display:flex;gap:12px;flex-direction:column;align-items:center}
  .btn{
    display:inline-block;border:0;border-radius:12px;padding:14px 22px;
    font-weight:700;text-decoration:none;font-size:18px;
    width:100%;max-width:420px;cursor:pointer
  }
  .btn-primary{background:var(--green);color:#fff}
  .btn-outline{background:#eef3ee;color:#0b0b0b}
  .hint{font-size:13px;color:#666;margin-top:8px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>WhatsApp qrupuna qoşul</h1>
    <p>Aşağıdakı düyməni bas və birbaşa qrupa keç.</p>

    <!-- iOS üçün 2 düymə göstəririk, amma hər ikisi eyni linki açır -->
    <div id="iosPanel" class="hidden">
      <div class="row">
        <a id="btnIOS_WAB" class="btn btn-primary"  href="#">WhatsApp ilə aç</a>
        <a id="btnIOS_WA"  class="btn btn-outline" href="#">Alternativ aç</a>
      </div>
      <p class="hint">TikTok/Instagram içindən də açılsa işləyəcək.</p>
    </div>

    <!-- Android -->
    <div id="androidPanel" class="hidden">
      <a id="btnAND" class="btn btn-primary" href="#">Qrupa qoşul (Android)</a>
      <p class="hint">Telefonunda WhatsApp və ya WhatsApp Business quraşdırılıbsa, avtomatik həmin tətbiqdə açılacaq.</p>
    </div>

    <!-- Digər platformalar -->
    <div id="otherPanel" class="hidden">
      <a id="btnOTHER" class="btn btn-primary" href="#">Qrupa qoşul</a>
    </div>
  </div>
</div>

<script>
  /* ==== DƏVƏT KODU ==== */
  const CODE = "GbbXxshpZM27imtEcy0Eos"; // topluluq/qrup kodun

  /* ==== Link ==== */
  const CHAT = `https://chat.whatsapp.com/${CODE}`;

  /* ==== Detektorlar ==== */
  const UA = navigator.userAgent || navigator.vendor || window.opera;
  const isAndroid = /Android/i.test(UA);
  const isIOS     = /iPhone|iPad|iPod/i.test(UA);

  function goToChat() {
    // yalnız https linkindən istifadə – deep-link YOXDUR
    window.location.href = CHAT;
  }

  function setupIOS(){
    document.getElementById("iosPanel").classList.remove("hidden");
    document.getElementById("btnIOS_WAB").addEventListener("click", function(e){
      e.preventDefault(); goToChat();
    });
    document.getElementById("btnIOS_WA").addEventListener("click", function(e){
      e.preventDefault(); goToChat();
    });
  }

  function setupAndroid(){
    document.getElementById("androidPanel").classList.remove("hidden");
    document.getElementById("btnAND").addEventListener("click", function(e){
      e.preventDefault(); goToChat();
    });
  }

  function setupOther(){
    document.getElementById("otherPanel").classList.remove("hidden");
    document.getElementById("btnOTHER").addEventListener("click", function(e){
      e.preventDefault(); goToChat();
    });
  }

  (function init(){
    if (isIOS)         setupIOS();
    else if (isAndroid) setupAndroid();
    else               setupOther();
  })();
</script>
</body>
</html>
